        .download-bar a {
            color: #03c77f;
            text-decoration: none;
            font-size: 12px;
        }
        .download-bar a:hover { color: #00ef37; }

        /* Responsive */
        @media (max-width: 600px) {
            .page { margin-top: 50px; padding: 0 8px; }
            .pdf-container iframe { height: calc(100vh - 90px); }
            .download-bar { font-size: 11px; padding: 10px 12px; }
